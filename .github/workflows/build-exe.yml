name: Build Windows exe

on:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "mask_picker.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PDFMaskingTool.exe
        run: |
          pyinstaller --onefile --noconsole --name PDFMaskingTool main.py

      - name: Build MaskPicker.exe
        run: |
          pyinstaller --onefile --noconsole --name MaskPicker mask_picker.py

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFMaskingTool-windows-exe
          path: |
            dist/PDFMaskingTool.exe
            dist/MaskPicker.exe
